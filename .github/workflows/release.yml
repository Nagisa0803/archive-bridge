name: Native builds and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: windows, arch: x64, python-arch: x64}
          - {runner: windows-11-arm, platform: windows, arch: arm64, python-arch: arm64}
          - {runner: ubuntu-22.04, platform: linux, arch: x64, python-arch: x64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64, python-arch: arm64}
          - {runner: macos-15-intel, platform: macos, arch: x64, python-arch: x64}
          - {runner: macos-15, platform: macos, arch: arm64, python-arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Install pinned runtime and build dependencies
        run: python -m pip install . -r requirements-build.txt
      - name: Offline tests and source privacy checks
        run: |
          python scripts/check_public.py
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests
          python -m archive_bridge --self-test --data-dir .ci-self-test
      - name: Build native package
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --version ${{ github.ref_name }}
      - name: Run compiled Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./dist/archive-bridge/archive-bridge.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native version check failed' }
          & ./dist/archive-bridge/archive-bridge.exe --self-test --data-dir .ci-native-test
          if ($LASTEXITCODE -ne 0) { throw 'Native self-test failed' }
      - name: Run compiled Unix executable
        if: runner.os != 'Windows'
        run: |
          ./dist/archive-bridge/archive-bridge --version
          ./dist/archive-bridge/archive-bridge --self-test --data-dir .ci-native-test
      - uses: actions/upload-artifact@v4
        with:
          name: archive-bridge-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-bridge-*
          path: release
          merge-multiple: true
      - name: Publish all six verified native packages and checksum manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
